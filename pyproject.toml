[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-tool"
version = "0.1.0"
description = "Automated security chaos engineering for microservice systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.scripts]
chaos-tool = "chaos_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chaos_tool.report" = ["template.html", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/chaos_tool/report/vendor"]

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
